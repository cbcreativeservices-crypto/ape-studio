ological Acoustics'. Astronomical sonification produces audio from data for communication, accessibility, or analysis; it does not describe a physical acoustic wave, medium, or measurable acoustic property. Per the metaphor-vs-physics rule for this branch it is flagged rather than authored as acoustic physics. Recommend routing to a data-communication or visualization topic if the row is retained.", "default": "drop"}, {"id": null, "term": "Sonic affordance", "src": "soundviz", "in_db": false, "topic": "Archaeological & Heritage Acoustics", "reason": "Coined/loosely used term with no single authoritative published definition in archaeological or heritage acoustics. 'Affordance' derives from Gibsonian perception theory, and 'sonic affordance' appears mainly in music-technology and urban-sound contexts with varying meanings, not as a settled archaeoacoustics term. Cannot be defined to two authoritative sources in this subject without guessing. Flagged for editorial review.", "default": "drop"}, {"id": null, "term": "Sacred acoustics", "src": "soundviz", "in_db": false, "topic": "Archaeological & Heritage Acoustics", "reason": "Loosely used, non-standard label without a distinct authoritative published definition; it overlaps heavily with 'ritual acoustics' and 'heritage acoustics' and appears chiefly in popular or non-authoritative sources rather than the peer-reviewed literature. Cannot be defined to two authoritative sources as a term in its own right without guessing. Flagged for editorial review; the attested research theme is authored under 'Ritual acoustics'.", "default": "drop"}, {"id": null, "term": "Echoic affordance", "src": "soundviz", "in_db": false, "topic": "Archaeological & Heritage Acoustics", "reason": "Coined term with no authoritative published definition in the archaeology or heritage-acoustics literature; not established as a term of art distinct from general Gibsonian 'affordance' theory and echo studies. Cannot be sourced to two authoritative references without guessing. Flagged for editorial review.", "default": "drop"}, {"id": null, "term": "Vocal anthropology", "src": "soundviz", "in_db": false, "topic": "Anthropology & Sound Studies", "reason": "Not established as a named subfield with an authoritative scholarly definition. The anthropological study of the voice is real but is normally treated under linguistic anthropology, ethnomusicology, or voice studies. 'Vocal anthropology' as a discrete, defined term is idiosyncratic and lacks a canonical literature, so it cannot be defined confidently from authoritative sources.", "default": "drop"}, {"id": null, "term": "Biocultural soundscape", "src": "soundviz", "in_db": false, "topic": "Anthropology & Sound Studies", "reason": "Emergent compound term without a settled, authoritative scholarly definition. Its parts, biocultural diversity and soundscape, are each well established, but 'biocultural soundscape' appears only sporadically across ecomusicology and conservation writing with varying meanings and no canonical source, so it cannot be defined confidently as a single scholarly concept.", "default": "drop"}, {"id": null, "term": "Acoustic ontology", "src": "soundviz", "in_db": false, "topic": "Anthropology & Sound Studies", "reason": "Used only sporadically and without a distinct, authoritative definition. It overlaps almost entirely with 'sonic ontology' and the broader philosophy of sound and has no separate canonical literature of its own. As a discrete named concept it is idiosyncratic, so it cannot be defined confidently and separately.", "default": "drop"}, {"id": null, "term": "Acoustic proxy", "src": "soundviz", "in_db": false, "topic": "Cross-Disciplinary Sonic Sensing", "reason": "No single authoritative definition. 'Acoustic proxy' is a descriptive, context-dependent construction meaning 'an acoustic measurement used to stand in for some other quantity' (e.g., acoustic backscatter as a proxy for biomass, or an acoustic feature as a proxy for a  GROUPS.forEach(([src,label])=>{

       <div class="chips">${chips}</div>`;

 });
 counts();
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
