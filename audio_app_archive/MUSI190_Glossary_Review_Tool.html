<head>

        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #f0f2f5;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {

            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95em;
            opacity: 0.95;
        }

        /* Control Bar */
        .control-bar {
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-weight: 500;
        }

        .stat {
            font-size: 0.9em;
        }

        .stat-value {
            color: #667eea;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="search"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9em;
            min-width: 150px;
        }

        input[type="text"]:focus, input[type="search"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #f5f5f5;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }

        .btn-danger:hover {
            background: #d32f2f;
            color: white;
        }

        /* Terms Container */
        .terms-list {
            display: grid;
            gap: 12px;
        }

        .term-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s ease;
        }

        .term-card:hover {
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border-color: #667eea;
        }

        .term-card.flagged {
            border-left: 4px solid #ff9800;
            background: #fff9f3;
        }

        /* Term Header */
        .term-header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: start;
            margin-bottom: 10px;
        }

        .term-title-section {
            display: flex;
            align-items: start;
            gap: 10px;
        }

        .flag-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .term-name {
            font-size: 1.05em;
            font-weight: 700;
            color: #667eea;
            word-break: break-word;
        }

        .term-meta {
            font-size: 0.75em;
            color: #999;
            margin-top: 2px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            gap: 4px;
        }

        .meta-label {
            font-weight: 600;
            color: #666;
        }

        .flag-badge {
            background: #ff9800;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .term-card.flagged .flag-badge {
            opacity: 1;
        }

        /* Definitions Section */
        .definitions {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #ddd;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .def-item {
            margin-bottom: 8px;
        }

        .def-item:last-child {
            margin-bottom: 0;
        }

        .def-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .def-text {
            color: #555;
            margin-left: 8px;
        }

        /* Comment Section */
        .comment-section {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }

        .term-card.flagged .comment-section {
            display: block;
        }

        .comment-label {
            font-weight: 600;
            color: #764ba2;
            font-size: 0.85em;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9em;
            resize: vertical;
            min-height: 60px;
            background: #fafafa;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .comment-controls {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 0.85em;
        }

        .saved-indicator {
            color: #4caf50;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .saved-indicator.show {
            opacity: 1;
        }

        .btn-clear-comment {
            background: #f5f5f5;
            color: #d32f2f;
            padding: 5px 10px;
            border: 1px solid #ddd;
            font-size: 0.85em;
        }

        .btn-clear-comment:hover {
            background: #d32f2f;
            color: white;
            border-color: #d32f2f;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            background: white;
            border-radius: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 20% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .modal p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-confirm {
            background: #d32f2f;
            color: white;
        }

        .btn-confirm:hover {
            background: #b71c1c;
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 15px;
            }

            header h1 {
                font-size: 1.4em;
            }

            .control-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
            }

            .controls {
                width: 100%;
            }

            input[type="text"], input[type="search"] {

                min-width: 100%;
            }

            .term-header {
                grid-template-columns: 1fr;
            }

            .flag-badge {
                margin-left: 0;
                margin-top: 5px;
            }

            .term-meta {
                gap: 10px;
            }
        }

        /**
         * Load all terms and render
         */
        function loadTerms() {
            const container = document.getElementById('termsList');
            container.innerHTML = '';

            if (!glossaryData || glossaryData.length === 0) {
                container.innerHTML = '<div class="no-results"><h3>No terms found</h3></div>';
                return;
            }

            glossaryData.forEach((item, index) => {
                const termId = `term-${index}`;
                const isFlagged = localStorage.getItem(`${termId}-flagged`) === 'true';
                const comment = localStorage.getItem(`${termId}-comment`) || '';

                const card = document.createElement('div');
                card.className = 'term-card' + (isFlagged ? ' flagged' : '');
                card.id = termId + '-card';

                card.innerHTML = `
                    <div class="term-header">
                        <div class="term-title-section">
                            <input type="checkbox" class="flag-checkbox" 
                                id="${termId}-flag" 
                                ${isFlagged ? 'checked' : ''}
                                onchange="toggleFlag('${termId}')">
                            <div>
                                <div class="term-name">${escapeHtml(item.Term)}</div>
                                <div class="term-meta">
                                    <div class="meta-item">
                                        <span class="meta-label">Category:</span>
                                        <span>${escapeHtml(item.Category || 'N/A')}</span>
                                    </div>
                                    <div class="meta-item">
                                        <span class="meta-label">Level:</span>
                                        <span>${escapeHtml(item['Difficulty Level'] || 'N/A')}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <span class="flag-badge">⚠️ FLAGGED</span>

                    <div class="definitions">

                            <div class="def-text">${escapeHtml(item['Concise Definition'] || 'N/A')}</div>
                        </div>
                        <div class="def-item">
                            <div class="def-label">Plain-English Explanation</div>
                            <div class="def-text">${escapeHtml(item['Plain-English Explanation'] || 'N/A')}</div>
                        </div>
                    </div>

                    <div class="comment-section">
                        <div class="comment-label">🚩 Issue/Feedback:</div>
                        <textarea id="${termId}-comment" 
                            placeholder="Describe the issue with this term/definition..."
                            onchange="saveComment('${termId}')"

            const isFlagged = checkbox.checked;
            const card = document.getElementById(termId + '-card');

            localStorage.setItem(`${termId}-flagged`, isFlagged);

            if (isFlagged) {
                card.classList.add('flagged');
            } else {
                card.classList.remove('flagged');
            }

            updateStats();
        }

        /**
         * Save comment with auto-indicator
         */
        function saveComment(termId) {
            const textarea = document.getElementById(`${termId}-comment`);
            const value = textarea.value;
            localStorage.setItem(`${termId}-comment`, value);

            const indicator = document.getElementById(`saved-${termId}`);
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 1500);
        }

        /**
         * Clear individual comment
         */
        function clearComment(termId) {
            if (confirm('Clear this comment?')) {
                localStorage.removeItem(`${termId}-comment`);
                document.getElementById(`${termId}-comment`).value = '';
                updateStats();
            }
        }

        /**
         * Update statistics
         */
        function updateStats() {
            let flaggedCount = 0;
            glossaryData.forEach((item, index) => {
                if (localStorage.getItem(`term-${index}-flagged`) === 'true') {
                    flaggedCount++;
                }
            });
            document.getElementById('flaggedTerms').textContent = flaggedCount;
        }

        /**
         * Export flagged terms with issues
         */
        function exportFlagged() {
            const flaggedData = [];

            glossaryData.forEach((item, index) => {
                const termId = `term-${index}`;
                const isFlagged = localStorage.getItem(`${termId}-flagged`) === 'true';
                const comment = localStorage.getItem(`${termId}-comment`) || '';

                if (isFlagged) {
                    flaggedData.push({
                        term: item.Term,
                        conciseDefinition: item['Concise Definition'],
                        plainEnglishExplanation: item['Plain-English Explanation'],
                        category: item.Category,
                        difficultyLevel: item['Difficulty Level'],
                        instructorIssue: comment,
                        timestamp: new Date().toISOString()
                    });
                }
            });

            if (flaggedData.length === 0) {
                alert('No flagged terms to export.');
                return;
            }

            const jsonString = JSON.stringify(flaggedData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `MUSI190_FlaggedTerms_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            alert(`✓ Exported ${flaggedData.length} flagged term(s)!`);
        }

        /**
         * Setup search
         */
        function setupEventListeners() {
            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                const cards = document.querySelectorAll('.term-card');
                let visibleCount = 0;

                cards.forEach(card => {
                    const termName = card.querySelector('.term-name').textContent.toLowerCase();
                    const defText = card.querySelector('.definitions').textContent.toLowerCase();

                    if (termName.includes(query) || defText.includes(query)) {
                        card.style.display = '';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (visibleCount === 0 && query) {
                    const container = document.getElementById('termsList');
                    if (!container.querySelector('.no-results')) {
                        const noResults = document.createElement('div');
                        noResults.className = 'no-results';
                        noResults.innerHTML = `<h3>No results for "${escapeHtml(query)}"</h3>`;
                        container.appendChild(noResults);
                    }
                } else {
                    const noResults = document.querySelector('.no-results');
                    if (noResults) noResults.remove();
                }
            });

            window.addEventListener('click', function(event) {
                const modal = document.getElementById('confirmModal');
                if (event.target === modal) {
                    closeModal();
                }
            });

            // Warn before unload if flags exist
            window.addEventListener('beforeunload', function(e) {
                let hasFlagged = false;
                glossaryData.forEach((item, index) => {
                    if (localStorage.getItem(`term-${index}-flagged`) === 'true') {
                        hasFlagged = true;
                    }
                });

                if (hasFlagged) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
        }

        /**
         * Escape HTML
         */
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        /**
         * Confirm clear all
         */
        function confirmClearAll() {
            document.getElementById('confirmModal').style.display = 'block';
        }

        /**
         * Close modal
         */
        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        /**
         * Clear all flags and comments
         */
        function clearAllFlags() {
            glossaryData.forEach((item, index) => {
                localStorage.removeItem(`term-${index}-flagged`);
                localStorage.removeItem(`term-${index}-comment`);
            });
            loadTerms();
            updateStats();
            closeModal();
        }
    </script>
</body>
</html>
