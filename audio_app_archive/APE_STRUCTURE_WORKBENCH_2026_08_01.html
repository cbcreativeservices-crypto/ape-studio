<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP&E Structure Workbench — Topics / Certificates / Programs</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c; --line2:#3a4553;
  --txt:#e7edf3; --mut:#9aa7b4; --mut2:#6f7d8c;
  --accent:#4aa3ff; --accent2:#2b6cb0;
  --green:#39b57a; --amber:#e0a63c; --red:#e5665f; --purple:#a97be0; --teal:#3cb6c0;
  --chip:#232a33;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:12px 14px 80px}
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#12161c,#12161cf2);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--mut)}
.badge b{color:var(--txt);font-weight:650}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:7px 11px;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent2);border-color:var(--accent2)}
.btn.primary:hover{background:var(--accent)}
.btn.sm{padding:4px 8px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;max-width:1240px;margin-left:auto;margin-right:auto}
.tab{background:transparent;border:1px solid transparent;color:var(--mut);padding:7px 12px;border-radius:8px;font-size:13px}
.tab.active{background:var(--panel);border-color:var(--line2);color:var(--txt)}
.tab .cnt{color:var(--mut2);font-size:11px;margin-left:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
input[type=text],select{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px}
input[type=text]{min-width:200px;flex:1}
.chipfilter{display:flex;gap:6px;flex-wrap:wrap}
.fchip{background:var(--chip);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:5px 11px;font-size:12px}
.fchip.active{border-color:var(--accent);color:var(--txt);background:#1b2735}
.fchip .n{opacity:.7;margin-left:3px}
/* topic table */
.ttable{width:100%;border-collapse:collapse;font-size:13px}
.ttable th{position:sticky;top:0;text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 8px;border-bottom:1px solid var(--line2);background:var(--bg);cursor:pointer;white-space:nowrap}
.ttable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ttable tr:hover td{background:#141922}
.gs{color:var(--mut2);font-variant-numeric:tabular-nums;font-size:12px}
.tname{font-weight:600}
.tname .edited{color:var(--amber)}
.bar{height:6px;border-radius:4px;background:#243040;margin-top:4px;overflow:hidden;max-width:150px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2b6cb0,#4aa3ff)}
.bar.big>i{background:linear-gradient(90deg,#8a5cc7,#a97be0)}
.tc{font-variant-numeric:tabular-nums;font-weight:600}
.cov{display:inline-flex;gap:4px}
.pill{border-radius:20px;padding:2px 8px;font-size:11px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;cursor:pointer}
.pill:hover{border-color:var(--accent);color:var(--txt)}
.pill.zero{color:var(--red);border-color:#5a2f2d}
.recs{display:flex;gap:4px;flex-wrap:wrap}
.rec{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;border-radius:5px;padding:2px 6px;font-weight:700}
.rec.oversized{background:#3a2340;color:#d9a7f0;border:1px solid #6a3d78}
.rec.large{background:#33294a;color:#c3b4ef;border:1px solid #4c3d70}
.rec.empty{background:#3a2422;color:#f0a49e;border:1px solid #6a3a36}
.rec.tiny{background:#33302a;color:#e6cf9c;border:1px solid #5a5138}
.rec.orphan{background:#232f3a;color:#8fd0e6;border:1px solid #35576a}
.rec.sub90{background:#2a2320;color:#f0b48a;border:1px solid #6a4a36}
/* outline certificates */
.outline{margin-top:8px}
.ol-track{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:18px 0 6px;border-bottom:1px solid var(--line2);padding-bottom:4px}
.ol-cert{margin:0 0 10px 2px}
.ol-cert-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ol-seq{color:var(--mut2);font-variant-numeric:tabular-nums;font-size:11px;width:22px}
.ol-cert-h b{font-size:14px}
.ol-meta{color:var(--mut2);font-size:11px}
.ol-list{list-style:none;margin:4px 0 4px 30px;padding:0;border-left:1px solid var(--line)}
.ol-list li{padding:3px 0 3px 12px;font-size:13px;display:flex;align-items:center;gap:7px}
.ol-list li:hover{background:#141922}
.ol-list li.low{color:#f0b48a}
.ol-gs{color:var(--mut2);font-variant-numeric:tabular-nums;font-size:11px;min-width:34px}
.ol-tc{color:var(--mut2);font-variant-numeric:tabular-nums;font-size:11px}
.ol-list li .x{margin-left:auto;color:var(--mut2);cursor:pointer;font-weight:700;opacity:0}
.ol-list li:hover .x{opacity:1}
.ol-list li .x:hover{color:var(--red)}
.disp{display:flex;gap:3px;flex-wrap:wrap}
.dbtn{background:transparent;border:1px solid var(--line2);color:var(--mut);border-radius:6px;padding:3px 7px;font-size:11px}
.dbtn:hover{border-color:var(--accent);color:var(--txt)}
.dbtn.on.keep{background:#1c3a2c;border-color:var(--green);color:#a7e6c6}
.dbtn.on.split{background:#3a2340;border-color:var(--purple);color:#d9a7f0}
.dbtn.on.merge{background:#233a3c;border-color:var(--teal);color:#9fe1e6}
.dbtn.on.del{background:#3a2422;border-color:var(--red);color:#f0a49e}
.dbtn.on.flag{background:#33302a;border-color:var(--amber);color:#e6cf9c}
.note{margin-top:5px;width:100%;background:#121821;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 7px;font-size:12px;display:none}
.note.show{display:block}
/* cert/program cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.trackhdr{grid-column:1/-1;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 -2px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card.warn{border-color:#6a3a36}
.card h3{margin:0 0 3px;font-size:14px}
.card .meta{color:var(--mut2);font-size:11px;margin-bottom:8px}
.mchips{display:flex;flex-wrap:wrap;gap:5px}
.mchip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line2);border-radius:7px;padding:3px 7px;font-size:12px}
.mchip .x{color:var(--mut2);cursor:pointer;font-weight:700}
.mchip .x:hover{color:var(--red)}
.mchip .qc{color:var(--mut2);font-variant-numeric:tabular-nums;font-size:10.5px}
.mchip.elec{border-style:dashed}
.mchip.added{border-color:var(--green)}
.subhead{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin:9px 0 5px}
.addbtn{margin-top:8px}
/* modal */
.overlay{position:fixed;inset:0;background:#000a;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:640px;width:100%;padding:16px}
.modal h2{margin:0 0 4px;font-size:16px}
.modal .mut{color:var(--mut);font-size:12px;margin-bottom:12px}
.picklist{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:hover{background:#141922}
.pick:last-child{border-bottom:none}
.pick .cb{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.pick.on .cb{background:var(--accent2);border-color:var(--accent2)}
.pick .tk{flex:1}
.pick .tk small{color:var(--mut2)}
.modrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.close{cursor:pointer;color:var(--mut2);font-size:20px;line-height:1}
/* review */
.chgrp{margin-bottom:16px}
.chgrp h3{font-size:13px;margin:0 0 6px;color:var(--txt)}
.chitem{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.chitem .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:5px;font-weight:700;flex:none}
.k.cert{background:#1b2735;color:#8fd0e6}
.k.prog{background:#26203a;color:#c3b4ef}
.k.rename{background:#33302a;color:#e6cf9c}
.k.decision{background:#233a3c;color:#9fe1e6}
.chitem .body{flex:1}
.add{color:var(--green)} .rem{color:var(--red)}
pre{background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;color:#cfe3f5;max-height:46vh}
.empty-state{color:var(--mut);text-align:center;padding:40px}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut2);font-size:11px;margin-top:6px}
.warnbar{background:#2a1f1c;border:1px solid #6a3a36;color:#f0c4bf;border-radius:8px;padding:8px 11px;font-size:12px;margin:10px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2a1f;border:1px solid var(--green);color:#c6f0d8;padding:9px 16px;border-radius:24px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){
  .ttable thead{display:none}
  .ttable,.ttable tbody,.ttable tr,.ttable td{display:block;width:100%}
  .ttable tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px;background:var(--panel)}
  .ttable td{border:none;padding:5px 6px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<header>
  <div class="hrow">
    <div>

</header>

const LS_KEY = "ape_workbench_" + DATA.snapshot_ts;

// ---------- working model ----------
const topicByGs = {};
DATA.topics.forEach(t=>topicByGs[t.gs]=t);
const legacyByGs = {}; DATA.legacy.forEach(t=>legacyByGs[t.gs]=t);

// universal corequisite gs set (covered even if not a member)
const coreqSet = new Set();
DATA.certs.forEach(c=>(c.corequisite_gs||[]).forEach(g=>coreqSet.add(g)));
DATA.programs.forEach(p=>(p.corequisite_gs||[]).forEach(g=>coreqSet.add(g)));

// mutable state, persisted to localStorage
let W = loadState();
function freshState(){
  return {
    certM: Object.fromEntries(DATA.certs.map(c=>[c.id,[...c.member_topic_gs]])),
    progM: Object.fromEntries(DATA.programs.map(p=>[p.id,[...p.member_topic_gs]])),
    progE: Object.fromEntries(DATA.programs.map(p=>[p.id,[...(p.elective_gs||[])]])),
    certName: {}, progName: {},
    topicName: {},           // gs -> new name
    disp: {},                // gs -> {type, note, target}
  };
}
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.certM) return s; }catch(e){}
  return freshState();
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(W)); refreshCounts(); }
function resetAll(){ if(confirm("Discard ALL unsaved changes and reload the original snapshot?")){ W=freshState(); save(); render(); toast("Reset to snapshot"); } }

// ---------- derived ----------
function certsWith(gs){ return DATA.certs.filter(c=> W.certM[c.id].includes(gs)); }
function progsWith(gs){ return DATA.programs.filter(p=> W.progM[p.id].includes(gs) || W.progE[p.id].includes(gs)); }
function tname(gs){ return W.topicName[gs] || (topicByGs[gs]?topicByGs[gs].name:("gs"+gs)); }
function certName(c){ return W.certName[c.id] || c.name; }
function progName(p){ return W.progName[p.id] || p.name; }

function recFlags(t){
  const f=[]; const tc=t.term_count;
  if(tc===0) f.push('empty'); else if(tc<10) f.push('tiny');
  if(tc<90) f.push('sub90');
  if(tc>=400) f.push('oversized'); else if(tc>=250) f.push('large');
  const cov = certsWith(t.gs).length, pc = progsWith(t.gs).length;
  if(cov===0 && pc===0 && !coreqSet.has(t.gs)) f.push('orphan');
  return f;
}

let filter = "all", sortKey="gs", sortDir=1, search="";
document.getElementById("tabs").addEventListener("click",e=>{

  document.getElementById("tcTopics").textContent=DATA.topics.length;
  let orphan=0,over=0;

// ---------- TOPICS VIEW ----------
function topicsView(){
  const counts={all:DATA.topics.length,sub90:0,orphan:0,oversized:0,large:0,empty:0,tiny:0,decided:0};
  DATA.topics.forEach(t=>{const f=recFlags(t); f.forEach(x=>{if(counts[x]!=null)counts[x]++;}); if(W.disp[t.gs])counts.decided++;});
  const fchips=[["all","All"],["sub90","<90 terms"],["orphan","Orphans"],["oversized","Oversized ≥400"],["large","Large 250–399"],["empty","Empty"],["tiny","Tiny 1–9"],["decided","Has decision"]]
    .map(([k,l])=>`<button class="fchip ${filter===k?'active':''}" data-f="${k}">${l}<span class="n">${counts[k]!=null?counts[k]:''}</span></button>`).join("");

  let rows = DATA.topics.slice();
  if(search){const q=search.toLowerCase(); rows=rows.filter(t=>tname(t.gs).toLowerCase().includes(q)||(""+t.gs).includes(q));}
  if(filter!=="all"){ rows=rows.filter(t=> filter==="decided" ? W.disp[t.gs] : recFlags(t).includes(filter)); }
  rows.sort((a,b)=>{
    let av,bv;
    if(sortKey==="gs"){av=a.gs;bv=b.gs;}
    else if(sortKey==="tc"){av=a.term_count;bv=b.term_count;}
    else if(sortKey==="cov"){av=certsWith(a.gs).length;bv=certsWith(b.gs).length;}
    else if(sortKey==="name"){av=tname(a.gs).toLowerCase();bv=tname(b.gs).toLowerCase();}
    return av<bv?-1*sortDir:av>bv?1*sortDir:0;
  });

  const maxTc=967;
  const body = rows.map(t=>{
    const cov=certsWith(t.gs), pc=progsWith(t.gs);
    const flags=recFlags(t);
    const recs=flags.map(f=>`<span class="rec ${f}">${f}</span>`).join("");
    const big=t.term_count>=400?'big':'';
    const d=W.disp[t.gs];
    const dbtn=(k,lbl,cls)=>`<button class="dbtn ${cls} ${d&&d.type===k?'on '+cls:''}" data-disp="${k}" data-gs="${t.gs}">${lbl}</button>`;
    const renamed=W.topicName[t.gs]?'<span class="edited" title="renamed"> ✎</span>':'';
    const noteVal=d&&d.note?d.note:'';
    return `<tr data-gs="${t.gs}">

      </div></td>
    </tr>`;
  }).join("");

  const th=(k,l)=>`<th data-sort="${k}">${l}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`;
  return `

}

// ---------- CHANGE DIFF ----------
function arrEq(a,b){ if(a.length!==b.length)return false; const s=new Set(b); return a.every(x=>s.has(x)); }
function changeList(){
  const out=[];
  DATA.certs.forEach(c=>{
    const cur=W.certM[c.id], orig=c.member_topic_gs;
    const added=cur.filter(g=>!orig.includes(g)), removed=orig.filter(g=>!cur.includes(g));
    if(W.certName[c.id]&&W.certName[c.id]!==c.name) out.push({kind:'rename',t:'cert',id:c.id,from:c.name,to:W.certName[c.id]});
    if(added.length||removed.length) out.push({kind:'cert',id:c.id,name:certName(c),added,removed,cur:[...cur]});
  });
  DATA.programs.forEach(p=>{
    const cm=W.progM[p.id], ce=W.progE[p.id];
    const am=cm.filter(g=>!p.member_topic_gs.includes(g)), rm=p.member_topic_gs.filter(g=>!cm.includes(g));
    const ae=ce.filter(g=>!(p.elective_gs||[]).includes(g)), re=(p.elective_gs||[]).filter(g=>!ce.includes(g));
    if(W.progName[p.id]&&W.progName[p.id]!==p.name) out.push({kind:'rename',t:'prog',id:p.id,from:p.name,to:W.progName[p.id]});
    if(am.length||rm.length||ae.length||re.length) out.push({kind:'prog',id:p.id,name:progName(p),am,rm,ae,re,cm:[...cm],ce:[...ce]});
  });
  Object.keys(W.topicName).forEach(gs=>{ if(topicByGs[gs]&&W.topicName[gs]&&W.topicName[gs]!==topicByGs[gs].name) out.push({kind:'rename',t:'topic',gs:+gs,from:topicByGs[gs].name,to:W.topicName[gs]}); });
  Object.keys(W.disp).forEach(gs=>{ const d=W.disp[gs]; if(d&&d.type&&d.type!=='keep') out.push({kind:'decision',gs:+gs,type:d.type,note:d.note||'',target:d.target||null}); });
  return out;
}

  const cl=changeList();
  if(!cl.length) return '<div class="empty-state">No changes yet. Reassign topics, rename, or flag decisions — they will collect here and export as SQL + JSON.</div>';

  cl.forEach(c=> g[c.kind].push(c));
  let h='<div class="controls"><button class="btn primary" id="copySql">Copy SQL</button><button class="btn" id="dlSql">Download SQL</button><button class="btn" id="dlJson">Download JSON changelog</button><button class="btn ghost" id="resetAll" style="margin-left:auto;border-color:#6a3a36;color:#f0a49e">Reset all</button></div>';

    h+=`<div class="chitem"><span class="k cert">CERT</span><div class="body"><b>${esc(c.name)}</b><br>${c.added.map(x=>`<span class=add>+ ${esc(tname(x))}</span>`).join(" ")} ${c.removed.map(x=>`<span class=rem>− ${esc(tname(x))}</span>`).join(" ")}</div></div>`;
  }); h+='</div>'; }
  if(g.prog.length){ h+='<div class="chgrp"><h3>Program membership</h3>'; g.prog.forEach(c=>{
    const parts=[]; c.am.forEach(x=>parts.push(`<span class=add>+ ${esc(tname(x))}</span>`)); c.rm.forEach(x=>parts.push(`<span class=rem>− ${esc(tname(x))}</span>`));
    c.ae.forEach(x=>parts.push(`<span class=add>+elec ${esc(tname(x))}</span>`)); c.re.forEach(x=>parts.push(`<span class=rem>−elec ${esc(tname(x))}</span>`));
    h+=`<div class="chitem"><span class="k prog">PROG</span><div class="body"><b>${esc(c.name)}</b><br>${parts.join(" ")}</div></div>`;

    h+=`<div class="chitem"><span class="k rename">${c.t.toUpperCase()}</span><div class="body">${esc(c.from)} → <b>${esc(c.to)}</b></div></div>`;
  }); h+='</div>'; }
  if(g.decision.length){ h+='<div class="chgrp"><h3>Structural decisions (proposals — reviewed &amp; applied by Machine A)</h3>'; g.decision.forEach(c=>{
    h+=`<div class="chitem"><span class="k decision">${c.type.toUpperCase()}</span><div class="body"><b>${esc(tname(c.gs))}</b> <span class=gs>(gs ${c.gs})</span>${c.target?(' → '+esc(tname(c.target))):''}${c.note?('<br><span class=sub>'+esc(c.note)+'</span>'):''}</div></div>`;
  }); h+='</div>'; }
  h+='<div class="subhead">SQL preview</div><pre id="sqlPre">'+esc(genSql())+'</pre>';
  return h;
}

// ---------- SQL GEN ----------
function gsArr(a){ return "'{"+a.join(",")+"}'"; }
function q(s){ return "'"+String(s).replace(/'/g,"''")+"'"; }
function genSql(){
  const cl=changeList(); if(!cl.length) return "-- no changes";
  let s="-- AP&E Structure Workbench export\n-- snapshot "+DATA.snapshot_ts+" · project "+DATA.project_id+" · draft cv "+DATA.draft_cv+"\n-- Apply as Machine A (sole DB writer). Review before running.\nBEGIN;\n";
  // certs
  cl.filter(c=>c.kind==='cert').forEach(c=>{
    s+="\n-- CERT "+c.name+"\n";
    s+="UPDATE certificates SET member_topic_gs="+gsArr(c.cur)+" WHERE id='"+c.id+"';\n";
    s+="DELETE FROM certificate_topics WHERE certificate_id='"+c.id+"';\n";
    c.cur.forEach((g,i)=>{ const t=topicByGs[g]; s+="INSERT INTO certificate_topics(certificate_id,achievement_id,gs,seq,is_required) VALUES('"+c.id+"',"+(t?("'"+t.id+"'"):"NULL")+","+g+","+(i+1)+",true);\n"; });
  });
  cl.filter(c=>c.kind==='prog').forEach(c=>{
    s+="\n-- PROGRAM "+c.name+"\n";
    s+="UPDATE programs SET member_topic_gs="+gsArr(c.cm)+", elective_gs="+gsArr(c.ce)+" WHERE id='"+c.id+"';\n";
    s+="DELETE FROM program_topics WHERE program_id='"+c.id+"';\n";
    let seq=0;
    c.cm.forEach(g=>{ const t=topicByGs[g]; seq++; s+="INSERT INTO program_topics(program_id,achievement_id,gs,seq,is_elective) VALUES('"+c.id+"',"+(t?("'"+t.id+"'"):"NULL")+","+g+","+seq+",false);\n"; });
    c.ce.forEach(g=>{ const t=topicByGs[g]; seq++; s+="INSERT INTO program_topics(program_id,achievement_id,gs,seq,is_elective) VALUES('"+c.id+"',"+(t?("'"+t.id+"'"):"NULL")+","+g+","+seq+",true);\n"; });
  });
  cl.filter(c=>c.kind==='rename').forEach(c=>{
    if(c.t==='cert') s+="\nUPDATE certificates SET name="+q(c.to)+" WHERE id='"+c.id+"';\n";
    else if(c.t==='prog') s+="\nUPDATE programs SET name="+q(c.to)+" WHERE id='"+c.id+"';\n";
    else { const t=topicByGs[c.gs]; s+="\nUPDATE achievements SET name="+q(c.to)+" WHERE id='"+t.id+"';  -- gs "+c.gs+" (draft cv only)\n"; }
  });
  const dec=cl.filter(c=>c.kind==='decision');
  if(dec.length){
    s+="\n-- ============================================================\n-- STRUCTURAL DECISIONS — REVIEW REQUIRED (NOT auto-executed)\n-- Split/Merge/Delete touch terms (glossary_topics) & cert/program joins.\n-- Machine A to turn each into a reviewed migration.\n-- ============================================================\n";
    dec.forEach(c=>{ const t=topicByGs[c.gs];
      s+="-- "+c.type.toUpperCase()+": "+t.name+" (gs "+c.gs+", achievement_id "+t.id+", "+t.term_count+" terms)"+(c.target?(" -> "+tname(c.target)+" (gs "+c.target+")"):"")+(c.note?("  // "+c.note.replace(/\n/g,' ')):"")+"\n";
      if(c.type==='merge'&&c.target&&topicByGs[c.target]) s+="--   e.g. UPDATE glossary_topics SET achievement_id='"+topicByGs[c.target].id+"' WHERE achievement_id='"+t.id+"';  -- then retire gs "+c.gs+"\n";
    });
  }
  s+="\nCOMMIT;\n";
  return s;
}

function render(){
  const app=document.getElementById("app");
  if(view==="topics") app.innerHTML=topicsView();
  else if(view==="certs") app.innerHTML=certsView();
  else if(view==="programs") app.innerHTML=programsView();

}

// ---------- events (delegated) ----------
document.getElementById("app").addEventListener("click",e=>{
  const t=e.target;
  const sort=t.closest("[data-sort]"); if(sort){ const k=sort.dataset.sort; if(sortKey===k)sortDir*=-1; else {sortKey=k;sortDir=k==='tc'?-1:1;} render(); return; }
  const f=t.closest("[data-f]"); if(f){ filter=f.dataset.f; render(); return; }
  const disp=t.closest("[data-disp]"); if(disp){ toggleDisp(+disp.dataset.gs, disp.dataset.disp); return; }
  const ren=t.closest("[data-rename]"); if(ren){ renameTopic(+ren.dataset.rename); return; }
  const ec=t.closest("[data-editcerts]"); if(ec){ editMembership('cert',+ec.dataset.editcerts); return; }
  const ep=t.closest("[data-editprogs]"); if(ep){ editMembership('prog',+ep.dataset.editprogs); return; }
  const rmc=t.closest("[data-rmcert]"); if(rmc){ removeGs('cert',rmc.dataset.rmcert,+rmc.dataset.gs); return; }
  const rmp=t.closest("[data-rmprog]"); if(rmp){ removeProgGs(rmp.dataset.rmprog,rmp.dataset.kind,+rmp.dataset.gs); return; }
  const ac=t.closest("[data-addcert]"); if(ac){ addTopicPicker('cert',ac.dataset.addcert); return; }
  const ap=t.closest("[data-addprog]"); if(ap){ addTopicPicker('prog',ap.dataset.addprog,ap.dataset.kind); return; }
  const rc=t.closest("[data-rencert]"); if(rc){ renameEntity('cert',rc.dataset.rencert); return; }
  const rp=t.closest("[data-renprog]"); if(rp){ renameEntity('prog',rp.dataset.renprog); return; }
  if(t.id==='copySql'){ navigator.clipboard.writeText(genSql()).then(()=>toast("SQL copied")); return; }
  if(t.id==='dlSql'){ download("APE_structure_changes_"+DATA.snapshot_ts+".sql", genSql()); return; }
  if(t.id==='dlJson'){ download("APE_structure_changelog_"+DATA.snapshot_ts+".json", JSON.stringify({snapshot:DATA.snapshot_ts,project:DATA.project_id,changes:changeList()},null,2)); return; }
  if(t.id==='resetAll'){ resetAll(); return; }
});
document.getElementById("app").addEventListener("input",e=>{
  if(e.target.id==='search'){ search=e.target.value; clearTimeout(window._st); window._st=setTimeout(render,160); }
  const n=e.target.closest("[data-note]"); if(n){ const gs=+n.dataset.note; W.disp[gs]=W.disp[gs]||{type:'flag'}; W.disp[gs].note=n.value; save(); }
});

function toggleDisp(gs,type){
  const cur=W.disp[gs];
  if(cur&&cur.type===type){ delete W.disp[gs]; save(); render(); return; }
  if(type==='merge'){ mergePicker(gs); return; }
  W.disp[gs]={type, note:cur?cur.note:''}; save(); render();
}
function renameTopic(gs){ const cur=tname(gs); const v=prompt("Rename topic (gs "+gs+"):",cur); if(v==null)return; if(v.trim()&&v!==topicByGs[gs].name)W.topicName[gs]=v.trim(); else delete W.topicName[gs]; save(); render(); }
function renameEntity(kind,id){
  const obj=(kind==='cert'?DATA.certs:DATA.programs).find(x=>x.id===id);
  const cur=kind==='cert'?certName(obj):progName(obj);
  const v=prompt("Rename "+kind+":",cur); if(v==null)return;
  const store=kind==='cert'?W.certName:W.progName;
  if(v.trim()&&v!==obj.name)store[id]=v.trim(); else delete store[id];
  save(); render();
}
function removeGs(kind,id,gs){ const arr=W.certM[id]; const i=arr.indexOf(gs); if(i>=0)arr.splice(i,1); save(); render(); }
function removeProgGs(id,kind,gs){ const arr=kind==='e'?W.progE[id]:W.progM[id]; const i=arr.indexOf(gs); if(i>=0)arr.splice(i,1); save(); render(); }

// topic-centric: which certs/programs include this topic
function editMembership(kind,gs){
  const list=(kind==='cert'?DATA.certs:DATA.programs);
  const has=id=> kind==='cert'? W.certM[id].includes(gs) : (W.progM[id].includes(gs)||W.progE[id].includes(gs));
  const rows=list.map(o=>`<div class="pick ${has(o.id)?'on':''}" data-toggle="${o.id}"><span class="cb">${has(o.id)?'✓':''}</span><span class="tk">${esc(kind==='cert'?certName(o):progName(o))} <small>${kind==='cert'?esc(o.track):o.tier}</small></span></div>`).join("");
  openModal(`<div style="display:flex;justify-content:space-between"><h2>${kind==='cert'?'Certificates':'Programs'} containing</h2><span class="close" id="mc">✕</span></div>
    <div class="mut">${esc(tname(gs))} · gs ${gs} · ${topicByGs[gs].term_count} terms — tap to add/remove</div>
    <div class="picklist">${rows}</div><div class="modrow"><button class="btn primary" id="mdone">Done</button></div>`);
  document.getElementById("mc").onclick=closeModal;
  document.getElementById("mdone").onclick=()=>{closeModal();render();};
  modal.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.toggle;
    if(kind==='cert'){ const a=W.certM[id]; const i=a.indexOf(gs); if(i>=0)a.splice(i,1); else a.push(gs); }
    else { const a=W.progM[id]; const i=a.indexOf(gs); if(i>=0)a.splice(i,1); else { const e=W.progE[id]; const j=e.indexOf(gs); if(j>=0)e.splice(j,1); else a.push(gs);} }
    el.classList.toggle("on"); el.querySelector(".cb").textContent=el.classList.contains("on")?'✓':''; save();
  });
}

// merge target picker

  const render2=()=>{ let rows=DATA.topics.filter(t=>t.gs!==gs); if(q){const s=q.toLowerCase();rows=rows.filter(t=>tname(t.gs).toLowerCase().includes(s)||(""+t.gs).includes(s));} return rows.slice(0,400).map(t=>`<div class="pick" data-tgt="${t.gs}"><span class="cb"></span><span class="tk">${esc(tname(t.gs))} <small>gs ${t.gs} · ${t.term_count} terms</small></span></div>`).join(""); };
  openModal(`<div style="display:flex;justify-content:space-between"><h2>Merge into…</h2><span class="close" id="mc">✕</span></div>
    <div class="mut">Merge <b>${esc(tname(gs))}</b> (gs ${gs}) into which topic? Its ${topicByGs[gs].term_count} terms would move there.</div>
    <input type="text" id="tp" placeholder="Search target topic…" style="width:100%;margin-bottom:8px">
    <div class="picklist" id="pl">${render2()}</div>`);
  document.getElementById("mc").onclick=closeModal;
  const pl=document.getElementById("pl");
  document.getElementById("tp").oninput=e=>{q=e.target.value; pl.innerHTML=render2(); bind();};
  function bind(){ pl.querySelectorAll("[data-tgt]").forEach(el=>el.onclick=()=>{ const tgt=+el.dataset.tgt; W.disp[gs]={type:'merge',target:tgt,note:(W.disp[gs]&&W.disp[gs].note)||''}; save(); closeModal(); render(); toast("Merge proposal recorded"); }); }
  bind();
}

// ---------- util ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function download(name,txt){ const b=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
let _tt; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove("show"),1600); }

render();
</script>
