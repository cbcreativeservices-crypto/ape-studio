<!DOCTYPE html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<title>AP&E Missing-Term Approval</title>
<style>
:root{--add:#2e8b57;--addbg:#e9f7ef;--grey:#8a8f98;--line:#e3e6ea;--ink:#1f2733;--brand:#1f3864}
*{box-sizing:border-box}
body{font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;color:var(--ink);background:#fafbfc}
header{position:sticky;top:0;background:var(--brand);color:#fff;padding:14px 16px;z-index:5}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:13px;opacity:.9}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:4}
.bar button,.bar select{font:14px inherit;padding:8px 12px;border:1px solid #ccd2da;border-radius:8px;background:#fff;cursor:pointer}
.bar .primary{background:var(--add);color:#fff;border-color:var(--add);font-weight:600}
.count{margin-left:auto;font-weight:600}
.grp{margin:0}
.grp h2{font-size:14px;margin:0;padding:10px 16px;background:#f1f3f6;border-top:1px solid var(--line);color:var(--brand);position:sticky;top:106px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.row:hover{background:#f6f9ff}
.dot{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid #c3cad4;background:#fff;position:relative;transition:.12s}
.row.on .dot{background:var(--add);border-color:var(--add)}
.row.on .dot:after{content:"";position:absolute;left:7px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.term{flex:1;font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.add{background:var(--addbg);color:var(--add)}
.tag.cov{background:#eef0f2;color:var(--grey)}
.tag.skip{background:#fdf0ec;color:#b5502e}
.reason{flex:0 0 100%;font-size:12px;color:#6b727c;padding-left:36px;margin-top:2px}
.hidden{display:none}
footer{padding:24px 16px;color:#6b727c;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2733;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}
</style></head><body>
<header><h1>AP&amp;E — Broadcast/Studio Batch 2 Approval</h1>
<div class=sub>Tap a dot to approve. 599 candidates checked &middot; ~540 already in glossary &middot; 27 worth adding.</div></header>
<div class=bar>
<select id=filter>
<option value=add>Show: Recommended (27)</option>
<option value=all>Show: All 641</option>
<option value=on>Show: Approved only</option>
</select>
<button onclick="pick(true)">Approve all shown</button>
<button onclick="pick(false)">Clear shown</button>
<button class=primary onclick="copyList()">Copy approved</button>
<button onclick="downloadList()">Download .csv</button>
<span class=count><span id=n>0</span> approved</span>
</div>
<div id=list></div>
<footer>Approved terms export as a plain list you can paste back to me. Nothing is written to the database from this page.</footer>
<div id=toast></div>
<script>
const ROWS=[{"group": "Standards Bodies (no standalone entry exists)", "term": "AES (Audio Engineering Society)", "cov": "No", "rec": "ADD", "reason": "Core pro-audio standards body; referenced everywhere, not defined."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "IEC (International Electrotechnical Commission)", "cov": "No", "rec": "ADD", "reason": "Sets IEC 60268 etc.; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "ISO (International Organization for Standardization)", "cov": "No", "rec": "ADD", "reason": "Referenced (e.g. ISO 226 equal-loudness); no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "ITU / ITU-R (BS.1770 loudness)", "cov": "No", "rec": "ADD", "reason": "Owns BS.1770 loudness standard; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "EBU (European Broadcasting Union)", "cov": "No", "rec": "ADD", "reason": "EBU R128 loudness; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "ANSI (American National Standards Institute)", "cov": "No", "rec": "ADD", "reason": "US standards umbrella; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "NIST (Natl. Inst. of Standards & Technology)", "cov": "No", "rec": "ADD", "reason": "Calibration traceability anchor; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "IEEE (Inst. of Electrical & Electronics Engineers)", "cov": "No", "rec": "ADD", "reason": "No entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "CTA (Consumer Technology Association)", "cov": "No", "rec": "ADD", "reason": "CTA-2034 (Spinorama) etc.; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "TIA (Telecommunications Industry Association)", "cov": "No", "rec": "ADD", "reason": "Cabling standards; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "EIA (Electronic Industries Alliance)", "cov": "No", "rec": "ADD", "reason": "Rack units / legacy standards; no entry."}, {"group": "Standards Bodies (no standalone entry exists)", "term": "FCC (Federal Communications Commission)", "cov": "No", "rec": "ADD", "reason": "Governs US broadcast/RF; surprisingly no standalone entry."}, {"group": "Compliance & Certification Marks", "term": "CE Marking", "cov": "No", "rec": "ADD", "reason": "EU conformity mark; no entry."}, {"group": "Compliance & Certification Marks", "term": "WEEE Compliance", "cov": "No", "rec": "ADD", "reason": "E-waste directive; no entry."}, {"group": "Compliance & Certification Marks", "term": "UL Listing", "cov": "No", "rec": "ADD", "reason": "Safety listing; no entry."}, {"group": "Compliance & Certification Marks", "term": "CSA Certification", "cov": "No", "rec": "ADD", "reason": "Canadian safety cert; no entry."}, {"group": "Compliance & Certification Marks", "term": "T\u00dcV Certification", "cov": "No", "rec": "ADD", "reason": "EU safety/quality cert; no entry."}, {"group": "Compliance & Certification Marks", "term": "FCC Equipment Authorization", "cov": "No", "rec": "ADD", "reason": "Part 15/wireless device approval; no entry."}, {"group": "Compliance & Certification Marks", "term": "EMC Testing", "cov": "No", "rec": "ADD", "reason": "Electromagnetic compatibility; no entry."}, {"group": "Compliance & Certification Marks", "term": "ESD Testing", "cov": "No", "rec": "ADD", "reason": "Electrostatic-discharge immunity; no entry."}, {"group": "Compliance & Certification Marks", "term": "RF Emissions Testing", "cov": "No", "rec": "ADD", "reason": "Radiated/conducted emissions; no entry."}, {"group": "Metrology & QA", "term": "Calibration Traceability", "cov": "No", "rec": "ADD", "reason": "Chain to NIST/national standards; core metrology term."}, {"group": "Metrology & QA", "term": "Quality-Management System (QMS / ISO 9001)", "cov": "No", "rec": "ADD", "reason": "Manufacturing QA concept; no entry."}, {"group": "Real gaps surfaced", "term": "HRTF (Head-Related Transfer Function)", "cov": "No", "rec": "ADD", "reason": "Fundamental spatial/binaural term \u2014 genuine gap. High value."}, {"group": "Real gaps surfaced", "term": "Dialogue Normalization (dialnorm)", "cov": "No", "rec": "ADD", "reason": "AC-3/broadcast metadata term; real and searchable."}, {"group": "Real gaps surfaced", "term": "RF Multicoupler", "cov": "No", "rec": "ADD", "reason": "Standard wireless-mic antenna distribution; siblings already in DB."}, {"group": "Real gaps surfaced", "term": "Frequency Diversity", "cov": "No", "rec": "ADD", "reason": "Completes the diversity set (space/time/antenna already in DB)."}];
const list=document.getElementById('list');
const byGroup={};
ROWS.forEach((r,i)=>{r._i=i;(byGroup[r.group]=byGroup[r.group]||[]).push(r)});
const order=[...new Set(ROWS.map(r=>r.group))];
function tagClass(r){return r.rec==='ADD'?'add':(r.cov.startsWith('Yes')?'cov':'skip')}
function tagText(r){return r.rec==='ADD'?'RECOMMEND':(r.cov.startsWith('Yes')?'covered':'skip')}
order.forEach(g=>{
  const sec=document.createElement('div');sec.className='grp';sec.dataset.group=g;
  sec.innerHTML='<h2>'+g+'</h2>';
  byGroup[g].forEach(r=>{
    const d=document.createElement('div');d.className='row';d.dataset.i=r._i;d.dataset.rec=r.rec;
    d.innerHTML='<div class=dot></div><div class=term>'+esc(r.term)+'</div><div class="tag '+tagClass(r)+'">'+tagText(r)+'</div><div class=reason>'+esc(r.reason)+'</div>';
    d.onclick=()=>{d.classList.toggle('on');refresh()};
    sec.appendChild(d);
  });
  list.appendChild(sec);
});
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const approved=()=>[...document.querySelectorAll('.row.on')].map(d=>ROWS[+d.dataset.i].term);
function refresh(){document.getElementById('n').textContent=approved().length}
function pick(on){document.querySelectorAll('.row:not(.hidden)').forEach(d=>d.classList.toggle('on',on));refresh()}
function applyFilter(){const v=document.getElementById('filter').value;
  document.querySelectorAll('.row').forEach(d=>{
    const on=d.classList.contains('on'),rec=d.dataset.rec;
    let show = v==='all' || (v==='add'&&rec==='ADD') || (v==='on'&&on);
    d.classList.toggle('hidden',!show);
  });
  document.querySelectorAll('.grp').forEach(s=>{const any=[...s.querySelectorAll('.row')].some(r=>!r.classList.contains('hidden'));s.classList.toggle('hidden',!any)});
}
document.getElementById('filter').onchange=applyFilter;applyFilter();refresh();
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function copyList(){const a=approved();if(!a.length)return toast('Nothing approved yet');navigator.clipboard.writeText(a.join('\\n')).then(()=>toast(a.length+' terms copied')).catch(()=>toast('Copy blocked — use Download'))}
function downloadList(){const a=approved();if(!a.length)return toast('Nothing approved yet');
  const csv='term\\n'+a.map(t=>'"'+t.replace(/"/g,'""')+'"').join('\\n');
  const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);
  const x=document.createElement('a');x.href=u;x.download='approved_terms.csv';x.click();URL.revokeObjectURL(u);toast(a.length+' terms downloaded')}
</script></body></html>
