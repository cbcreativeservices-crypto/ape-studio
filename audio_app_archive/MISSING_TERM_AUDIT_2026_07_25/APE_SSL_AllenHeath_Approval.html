const list=document.getElementById('list');
const byGroup={};
ROWS.forEach((r,i)=>{r._i=i;(byGroup[r.group]=byGroup[r.group]||[]).push(r)});
const order=[...new Set(ROWS.map(r=>r.group))];
function tagClass(r){return r.rec==='ADD'?'add':(r.cov.startsWith('Yes')?'cov':'skip')}
function tagText(r){return r.rec==='ADD'?'RECOMMEND':(r.cov.startsWith('Yes')?'covered':'skip')}
order.forEach(g=>{
  const sec=document.createElement('div');sec.className='grp';sec.dataset.group=g;
  sec.innerHTML='<h2>'+g+'</h2>';
  byGroup[g].forEach(r=>{
    const d=document.createElement('div');d.className='row';d.dataset.i=r._i;d.dataset.rec=r.rec;
    d.innerHTML='<div class=dot></div><div class=term>'+esc(r.term)+'</div><div class="tag '+tagClass(r)+'">'+tagText(r)+'</div><div class=reason>'+esc(r.reason)+'</div>';
    d.onclick=()=>{d.classList.toggle('on');refresh()};
    sec.appendChild(d);
  });
  list.appendChild(sec);
});
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const approved=()=>[...document.querySelectorAll('.row.on')].map(d=>ROWS[+d.dataset.i].term);
function refresh(){document.getElementById('n').textContent=approved().length}
function pick(on){document.querySelectorAll('.row:not(.hidden)').forEach(d=>d.classList.toggle('on',on));refresh()}
function applyFilter(){const v=document.getElementById('filter').value;
  document.querySelectorAll('.row').forEach(d=>{
    const on=d.classList.contains('on'),rec=d.dataset.rec;
    let show = v==='all' || (v==='add'&&rec==='ADD') || (v==='on'&&on);
    d.classList.toggle('hidden',!show);
  });
  document.querySelectorAll('.grp').forEach(s=>{const any=[...s.querySelectorAll('.row')].some(r=>!r.classList.contains('hidden'));s.classList.toggle('hidden',!any)});
}
document.getElementById('filter').onchange=applyFilter;applyFilter();refresh();
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function copyList(){const a=approved();if(!a.length)return toast('Nothing approved yet');navigator.clipboard.writeText(a.join('\\n')).then(()=>toast(a.length+' terms copied')).catch(()=>toast('Copy blocked — use Download'))}
function downloadList(){const a=approved();if(!a.length)return toast('Nothing approved yet');
  const csv='term\\n'+a.map(t=>'"'+t.replace(/"/g,'""')+'"').join('\\n');
  const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);
  const x=document.createElement('a');x.href=u;x.download='approved_terms.csv';x.click();URL.revokeObjectURL(u);toast(a.length+' terms downloaded')}
